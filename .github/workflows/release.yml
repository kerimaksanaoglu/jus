name: Sürüm

# v ile başlayan bir etiket gönderildiğinde her platform için paket üretir,
# GitHub sürüm sayfasını oluşturur ve paket tanımlarını (Scoop, winget) günceller.
# Elle çalıştırıldığında yalnızca paketleri üretir; paketlemeyi sınamak içindir.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paket:
    name: Paket (${{ matrix.ad }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ad: linux-x64
          - os: macos-latest
            ad: macos-arm64
          - os: windows-latest
            ad: windows-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Derle
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Çalıştırılabilir dosya ek DLL gerektirmesin.
            make EXTRA=-static
          else
            make
          fi
      - name: Test
        run: make test
      - name: Paketle
        run: |
          surum="$(./jus --surum | cut -d' ' -f2)"
          klasor="jus-$surum-${{ matrix.ad }}"
          mkdir -p "$klasor"
          if [ "$RUNNER_OS" = "Windows" ]; then cp jus.exe "$klasor/"; else cp jus "$klasor/"; fi
          cp README.md LICENSE CHANGELOG.md "$klasor/"
          cp -r docs examples "$klasor/"
          # Sürüm numarası içermeyen kopya, "en son sürüm" bağlantıları içindir:
          # .../releases/latest/download/jus-${{ matrix.ad }}.zip
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$klasor.zip" "$klasor" > /dev/null
            cp "$klasor.zip" "jus-${{ matrix.ad }}.zip"
          else
            tar -czf "$klasor.tar.gz" "$klasor"
            cp "$klasor.tar.gz" "jus-${{ matrix.ad }}.tar.gz"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: paket-${{ matrix.ad }}
          path: |
            jus-*.zip
            jus-*.tar.gz

  eklenti:
    name: VS Code eklentisi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Paketle
        working-directory: editors/vscode
        run: |
          surum="$(node -p "require('./package.json').version")"
          npx --yes @vscode/vsce package --out "../../jus-vscode-$surum.vsix"
          cp "../../jus-vscode-$surum.vsix" ../../jus-vscode.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: paket-vscode
          path: jus-vscode*.vsix

  deneme-alani:
    name: Deneme alanı paketi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Derle ve sına
        run: |
          bash playground/derle.sh
          node playground/dene.cjs
      - name: Paketle
        run: |
          mkdir jus-deneme-alani
          cp playground/index.html playground/calisan.js playground/sun.py playground/simge.png \
             playground/jus.js playground/jus.wasm playground/README.md jus-deneme-alani/
          zip -qr jus-deneme-alani.zip jus-deneme-alani
      - uses: actions/upload-artifact@v4
        with:
          name: paket-deneme-alani
          path: jus-deneme-alani.zip

  yayinla:
    name: Sürüm sayfası
    needs: [paket, eklenti, deneme-alani]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: paket-*
          path: paketler
          merge-multiple: true
      - name: Sürüm notlarını çıkar
        run: |
          surum="${GITHUB_REF_NAME#v}"
          # Değişiklik günlüğünde bu sürüme ait bölümü al.
          awk -v s="## [$surum]" 'index($0, s) == 1 { yaz = 1; next } /^## \[/ { yaz = 0 } yaz' CHANGELOG.md > notlar.md
          test -s notlar.md
      - name: Sürümü yayımla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" paketler/* \
            --title "JUS ${GITHUB_REF_NAME#v}" \
            --notes-file notlar.md

  paket-tanimlari:
    name: Paket tanımlarını güncelle
    needs: yayinla
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: paket-windows-x64
          path: paketler
      # Yayımlanan zip dosyasının özetini Scoop ve winget tanımlarına yazar.
      - name: Tanımları üret
        run: |
          surum="${GITHUB_REF_NAME#v}"
          python3 tools/paket_tanimlari.py "$surum" "paketler/jus-$surum-windows-x64.zip"
      - name: Depoya işle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket paketleme
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Paket tanımları: ${GITHUB_REF_NAME#v}"
            git push origin HEAD:main
          fi
