name: Deneme alanı (GitHub Pages)

# main dalındaki her değişiklikte deneme alanını derler ve GitHub Pages'te yayımlar.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayimla:
    name: Derle ve yayımla
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayim.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Derle ve sına
        run: |
          bash playground/derle.sh
          node playground/dene.cjs
      - name: Siteyi hazırla
        run: |
          mkdir site
          cp playground/index.html playground/calisan.js playground/jus.js playground/jus.wasm site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: yayim
        uses: actions/deploy-pages@v4
