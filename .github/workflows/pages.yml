name: Site (GitHub Pages)

# main dalındaki her değişiklikte deneme alanını ve belge sitesini üretip
# GitHub Pages'te yayımlar:
#   /            deneme alanı
#   /belgeler/   belge sitesi
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayimla:
    name: Derle ve yayımla
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayim.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Deneme alanını derle ve sına
        run: |
          bash playground/derle.sh
          node playground/dene.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Belge sitesini üret
        run: |
          pip install -r tools/belge-sitesi/requirements.txt ./tools/pygments_jus
          mkdocs build --strict --site-dir site/belgeler
      - name: Deneme alanını siteye ekle
        run: |
          cp playground/index.html playground/calisan.js playground/simge.png \
             playground/jus.js playground/jus.wasm site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: yayim
        uses: actions/deploy-pages@v4
