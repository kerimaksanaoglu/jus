name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Derleme ve test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Derle
        run: make
      - name: Test
        run: make test
      - name: Örnek programlar
        run: make examples

  sanitize:
    name: Bellek denetimi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ASan + UBSan; cop toplayici her bellek ayirmada calisir.
      - name: Test
        run: bash tests/bellek-denetimi.sh

  playground:
    name: Deneme alanı (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Derle
        run: bash playground/derle.sh
      - name: Test
        run: node playground/dene.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: deneme-alani
          path: |
            playground/index.html
            playground/calisan.js
            playground/sun.py
            playground/jus.js
            playground/jus.wasm
