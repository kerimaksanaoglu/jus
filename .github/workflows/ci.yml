name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Derleme ve test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Derle
        run: make
      - name: Test
        run: make test

  sanitize:
    name: Bellek denetimi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ASan + UBSan; cop toplayici her bellek ayirmada calisir.
      - name: Test
        run: bash tests/bellek-denetimi.sh
