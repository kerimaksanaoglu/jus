name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Derleme ve test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Derle
        run: make
      - name: Test
        run: make test

  sanitize:
    name: Bellek denetimi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Her bellek ayırmada çöp toplayıcıyı çalıştırıp bellek hatalarını yakalar.
      - name: Derle
        run: make EXTRA="-g -fsanitize=address,undefined -fno-sanitize-recover=all -DJUS_DEBUG_STRESS_GC"
      - name: Test
        run: make test
